<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>工時登錄表單</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#c7551f;--steel:#1f4e78;--ok:#2a7a4a;--err:#b83030;--line:#ddd;--bg:#f5f3ee;--white:#fff;--font:"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{font-family:var(--font);background:var(--bg);color:#1a2332;font-size:15px;padding-bottom:40px}
.header{background:var(--steel);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:700}
.header .sub{font-size:11px;opacity:.75}
.card{background:var(--white);margin:12px;border-radius:6px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--steel);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--steel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:600;color:#5a6b7a;margin-bottom:4px}
input,select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:5px;font:inherit;font-size:14px;background:#fdfcfa;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.calc{background:#eef2f8;border-radius:5px;padding:10px 14px;display:flex;gap:24px;margin-top:4px}
.calc .val{font-size:22px;font-weight:700;color:var(--steel)}
.calc .lbl{font-size:10px;color:#7a8898}
.calc .warn{color:var(--err);font-size:12px;font-weight:600;align-self:center}
.btn{width:100%;padding:13px;border:none;border-radius:5px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-submit{background:var(--accent);color:#fff}
.btn-submit:hover{background:#a84518}
.btn-submit:disabled{background:#ccc;cursor:not-allowed}
.btn-clear{background:transparent;border:1.5px solid var(--line);color:#7a8898;margin-top:8px}
.status{border-radius:5px;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;margin-top:8px;display:none}
.status.ok{background:#e8f5e9;color:var(--ok);display:block}
.status.err{background:#fde8e8;color:var(--err);display:block}
.status.loading{background:#e8eef5;color:var(--steel);display:block}
.cfg-note{font-size:11px;color:#e8b88a;margin-top:4px;line-height:1.4}
/* 連線狀態指示 */
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.conn-dot.ok{background:#4caf50}
.conn-dot.err{background:#f44336}
.conn-dot.check{background:#ff9800}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="h1">⚙ 工時登錄表單</div>
    <div class="sub" id="connStatus"><span class="conn-dot check" id="connDot"></span>連線檢查中...</div>
  </div>
  <div style="font-size:11px;opacity:.75;text-align:right" id="recCount">－</div>
</div>

<!-- Supabase 設定說明（未設定時顯示） -->
<div class="card" id="setupCard" style="display:none">
  <h2>⚠ 需要設定雲端連線</h2>
  <p style="font-size:13px;color:#666;line-height:1.6">請依照設定指南完成 Supabase 設定後，將<br>
  <b>SUPABASE_URL</b> 和 <b>SUPABASE_KEY</b> 填入檔案頂端。</p>
</div>

<div class="card">
  <h2>基本資訊</h2>
  <div class="grid2">
    <div class="field"><label>日期</label><input type="date" id="f_date"></div>
    <div class="field"><label>類別</label>
      <input list="cat_dl" id="f_cat" placeholder="選擇或輸入">
      <datalist id="cat_dl"><option value="焊接"><option value="架模"><option value="鐳割"><option value="沖孔"><option value="彎管"><option value="沖壓"><option value="研磨"></datalist>
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label>人員姓名</label>
      <input list="person_dl" id="f_person" placeholder="選擇或輸入">
      <datalist id="person_dl"><option value="呂揚斌"><option value="木哈曼"><option value="杜黃山"><option value="穆賽榮"><option value="羅俊民"><option value="鄭明欽"><option value="陳冠杰"></datalist>
    </div>
    <div class="field"><label>機型</label>
      <input list="model_dl" id="f_model" placeholder="選擇或輸入">
      <datalist id="model_dl"><option value="AD4"><option value="AF08"><option value="B3925/B3935"><option value="CC03OT"><option value="DA01UB"><option value="JLD173"><option value="JOHN02"><option value="TS01MB"><option value="工具車"><option value="銓量"></datalist>
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label>機台號碼</label><input type="text" id="f_machine" placeholder="例：A1、3號機"></div>
    <div class="field"><label>桌次</label><input type="text" id="f_table" placeholder="例：1+2、B3"></div>
  </div>
</div>

<div class="card">
  <h2>時間 / 排程</h2>
  <div class="grid3">
    <div class="field"><label>開始時間</label><input type="time" id="f_start" value="08:00"></div>
    <div class="field"><label>結束時間</label><input type="time" id="f_end" value="17:20"></div>
    <div class="field"><label>休息(分鐘)</label><input type="number" id="f_rest" value="120" min="0"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>排程單號</label><input type="text" id="f_sched" placeholder="自由輸入"></div>
    <div class="field"><label>數量</label><input type="number" id="f_qty" min="0" placeholder="產出數量"></div>
  </div>
  <div class="calc" id="calcBox">
    <div><div class="lbl">實際工時</div><div class="val" id="calcH">7.33 時</div></div>
    <div><div class="lbl">分鐘數</div><div class="val" id="calcM">440 分</div></div>
    <div class="warn" id="calcWarn"></div>
  </div>
</div>

<div class="card">
  <h2>工序內容</h2>
  <div class="field"><label>工序內容</label><input type="text" id="f_content" placeholder="例：後貼地管組"></div>
  <div class="grid2">
    <div class="field"><label>規格 / 長度</label><input type="text" id="f_spec" placeholder="例：ψ40×80×1.8T"></div>
    <div class="field"><label>備註</label><input type="text" id="f_note" placeholder="補充說明"></div>
  </div>
  <button class="btn btn-submit" id="btnSubmit">送出工時紀錄</button>
  <button class="btn btn-clear" id="btnClear">清空表單</button>
  <div class="status" id="statusMsg"></div>
</div>

<script>
// ★★★ 請將 Supabase 設定填入這裡 ★★★
const SUPABASE_URL = 'https://grfxgtznzqrfjnbjkqvs.supabase.co';   // 例：https://xxxxxxxxxxxx.supabase.co
const SUPABASE_KEY = 'sb_publishable_wU-9AjKmljlzUE3VmANNKA_M1gtYeTz';
const TABLE_NAME   = 'worklog';
// ★★★★★★★★★★★★★★★★★★★★★★★

const $ = id => document.getElementById(id);

// ── 連線狀態 ──
async function checkConn(){
  if(!SUPABASE_URL || !SUPABASE_KEY){
    $('connDot').className='conn-dot err';
    $('connStatus').innerHTML='<span class="conn-dot err" id="connDot"></span>未設定雲端連線';
    $('setupCard').style.display='block';
    $('btnSubmit').disabled=true;
    return false;
  }
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=id&limit=1`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const cnt=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=id`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'count=exact'}
    });
    const total=cnt.headers.get('content-range')?.split('/')[1]||'?';
    $('connDot').className='conn-dot ok';
    $('connStatus').innerHTML=`<span class="conn-dot ok"></span>雲端連線正常`;
    $('recCount').textContent=`共 ${total} 筆紀錄`;
    $('btnSubmit').disabled=false;
    return true;
  } catch(e){
    $('connDot').className='conn-dot err';
    $('connStatus').innerHTML=`<span class="conn-dot err"></span>連線失敗`;
    $('btnSubmit').disabled=true;
    return false;
  }
}

// ── 工時計算 ──
function calcMins(){
  const s=$('f_start').value, e=$('f_end').value;
  const rest=parseInt($('f_rest').value||'0');
  if(!s||!e) return 0;
  const [sh,sm]=s.split(':').map(Number);
  const [eh,em]=e.split(':').map(Number);
  const m=(eh*60+em)-(sh*60+sm)-rest;
  if(m<0){ $('calcWarn').textContent='⚠ 時間有誤'; return 0; }
  $('calcWarn').textContent='';
  return m;
}
function updateCalc(){
  const m=calcMins();
  $('calcH').textContent=(m/60).toFixed(2)+' 時';
  $('calcM').textContent=m+' 分';
}
['f_start','f_end','f_rest'].forEach(id=>$(id).addEventListener('input',updateCalc));
updateCalc();

// ── 送出 ──
$('btnSubmit').onclick=async()=>{
  const date=$('f_date').value, cat=$('f_cat').value.trim();
  const person=$('f_person').value.trim(), model=$('f_model').value.trim();
  const machine=$('f_machine').value.trim(), table_no=$('f_table').value.trim();
  const start=$('f_start').value, end=$('f_end').value;
  const rest=parseInt($('f_rest').value||'0');
  const schedule=$('f_sched').value.trim();
  const qty=parseFloat($('f_qty').value)||0;
  const content=$('f_content').value.trim();
  const spec=$('f_spec').value.trim();
  const note=$('f_note').value.trim();
  const mins=calcMins();

  if(!date){ showStatus('請選擇日期','err'); return; }
  if(!person){ showStatus('請輸入人員姓名','err'); return; }
  if(mins<=0){ showStatus('開始/結束時間有誤，請重新確認','err'); return; }

  showStatus('送出中...','loading');
  $('btnSubmit').disabled=true;

  const payload={
    date, cat, person, machine, table_no, start_time:start, end_time:end,
    rest_min:rest, work_mins:mins, schedule, model, content, qty, spec, note,
    created_at: new Date().toISOString()
  };

  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      showStatus(`✓ 已送出！${date} ${person} ${cat} ${(mins/60).toFixed(2)}時`,'ok');
      clearForm();
      checkConn();
    } else {
      const err=await res.text();
      showStatus('送出失敗：'+err,'err');
    }
  } catch(e){
    showStatus('網路錯誤，請確認連線：'+e.message,'err');
  }
  $('btnSubmit').disabled=false;
};

function clearForm(){
  ['f_cat','f_person','f_model','f_machine','f_table','f_sched','f_qty','f_content','f_spec','f_note']
    .forEach(id=>$(id).value='');
  $('f_start').value='08:00';
  $('f_end').value='17:20';
  $('f_rest').value='120';
  updateCalc();
}

function showStatus(msg,type){
  const el=$('statusMsg');
  el.textContent=msg; el.className='status '+type;
  if(type==='ok') setTimeout(()=>{el.className='status';},4000);
}

$('btnClear').onclick=()=>{ clearForm(); $('statusMsg').className='status'; };
$('f_date').value=new Date().toISOString().slice(0,10);
checkConn();
</script>
</body></html>
