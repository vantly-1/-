<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>工時登錄表單</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#c7551f;--steel:#1f4e78;--ok:#2a7a4a;--err:#b83030;--line:#ddd;--bg:#f5f3ee;--white:#fff;--font:"Noto Sans TC","Noto Sans Thai","Noto Sans",sans-serif}
body{font-family:var(--font);background:var(--bg);color:#1a2332;font-size:15px;padding-bottom:40px}
.header{background:var(--steel);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:700}
.header .sub{font-size:11px;opacity:.75}
.card{background:var(--white);margin:12px;border-radius:6px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--steel);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--steel)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{margin-bottom:10px;position:relative}
.field:last-child{margin-bottom:0}
/* 自訂觸控下拉選單（取代原生 datalist，解決平板無法下拉選的問題） */
.combo-input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'><path fill='%237a8898' d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:32px}
.combo-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1.5px solid var(--accent);border-radius:6px;max-height:200px;overflow-y:auto;z-index:80;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.combo-item{padding:11px 13px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0eee8}
.combo-item:last-child{border-bottom:none}
.combo-item:active,.combo-item.hl{background:#eef2f8}
label{display:block;font-size:12px;font-weight:600;color:#5a6b7a;margin-bottom:4px}
.time-hint{display:none}
.t-box{display:flex;align-items:center;gap:4px}
.t-num{width:48px;padding:9px 4px;border:1.5px solid var(--line);border-radius:5px;font:inherit;font-size:15px;font-weight:600;text-align:center;background:#fdfcfa;-moz-appearance:textfield}
.t-num::-webkit-outer-spin-button,.t-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.t-num:focus{outline:none;border-color:var(--accent);background:#fff}
.t-sep{font-size:18px;font-weight:700;color:var(--steel);line-height:1}
input,select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:5px;font:inherit;font-size:14px;background:#fdfcfa;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.calc{background:#eef2f8;border-radius:5px;padding:10px 14px;display:flex;gap:24px;margin-top:4px}
.calc .val{font-size:22px;font-weight:700;color:var(--steel)}
.calc .lbl{font-size:10px;color:#7a8898}
.calc .warn{color:var(--err);font-size:12px;font-weight:600;align-self:center}
.btn{width:100%;padding:13px;border:none;border-radius:5px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-submit{background:var(--accent);color:#fff}
.btn-submit:hover{background:#a84518}
.btn-submit:disabled{background:#ccc;cursor:not-allowed}
.btn-clear{background:transparent;border:1.5px solid var(--line);color:#7a8898;margin-top:8px}
.status{border-radius:5px;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;margin-top:8px;display:none}
.status.ok{background:#e8f5e9;color:var(--ok);display:block}
.status.err{background:#fde8e8;color:var(--err);display:block}
.status.loading{background:#e8eef5;color:var(--steel);display:block}
.cfg-note{font-size:11px;color:#e8b88a;margin-top:4px;line-height:1.4}
/* 刪除紀錄 */
.rec-list{margin-top:8px}
.rec-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:#fdfcfa;font-size:13px;gap:8px}
.rec-item:last-child{margin-bottom:0}
.rec-info{flex:1;min-width:0;line-height:1.5}
.rec-info strong{color:var(--steel)}
.rec-info small{color:#7a8898;font-size:11px}
.btn-del{background:#fde8e8;color:var(--err);border:1.5px solid #f5baba;border-radius:4px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-del:hover{background:var(--err);color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:8px;padding:20px;width:90%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.modal-box h3{font-size:15px;margin-bottom:10px;color:var(--err)}
.modal-box p{font-size:13px;color:#444;margin-bottom:16px;line-height:1.6}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:8px 18px;border:none;border-radius:4px;font:inherit;font-size:14px;cursor:pointer}
.btn-cancel{background:#eee;color:#555}
.btn-confirm-del{background:var(--err);color:#fff}
/* 連線狀態指示 */
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.conn-dot.ok{background:#4caf50}
.conn-dot.err{background:#f44336}
.conn-dot.check{background:#ff9800}
/* 語言切換 */
.lang-bar{display:flex;gap:6px;align-items:center}
.lang-btn{padding:4px 10px;border:1.5px solid rgba(255,255,255,.4);border-radius:20px;background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.lang-btn:hover{background:rgba(255,255,255,.15)}
.lang-btn.active{background:#fff;color:var(--steel)}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="h1" id="txt_title">⚙ 工時登錄表單</div>
    <div class="sub" id="connStatus"><span class="conn-dot check" id="connDot"></span><span id="txt_conn">連線檢查中...</span></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" onclick="setLang('vi')">Tiếng Việt</button>
      <button class="lang-btn" onclick="setLang('th')">ภาษาไทย</button>
      <button class="lang-btn" onclick="setLang('id')">Indonesia</button>
    </div>
    <div style="font-size:11px;opacity:.75;text-align:right" id="recCount">－</div>
  </div>
</div>

<!-- Supabase 設定說明（未設定時顯示） -->
<div class="card" id="setupCard" style="display:none">
  <h2>⚠ 需要設定雲端連線</h2>
  <p style="font-size:13px;color:#666;line-height:1.6">請依照設定指南完成 Supabase 設定後，將<br>
  <b>SUPABASE_URL</b> 和 <b>SUPABASE_KEY</b> 填入檔案頂端。</p>
</div>

<div class="card">
  <h2 id="txt_basic">基本資訊</h2>
  <div class="grid2">
    <div class="field"><label id="txt_date">日期</label><input type="date" id="f_date"></div>
    <div class="field"><label id="txt_cat">類別</label>
      <input type="text" id="f_cat" placeholder="選擇或輸入">
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label id="txt_person">人員姓名</label>
      <input type="text" id="f_person" placeholder="選擇或輸入">
    </div>
    <div class="field"><label id="txt_model">機型</label>
      <input type="text" id="f_model" placeholder="選擇或輸入">
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label id="txt_machine">機台號碼</label><input type="text" id="f_machine" placeholder="例：A1、3號機"></div>
    <div class="field"><label id="txt_table">桌次</label><input type="text" id="f_table" placeholder="例：1+2、B3"></div>
  </div>
</div>

<div class="card">
  <h2 id="txt_time">時間 / 排程</h2>
  <div class="grid3">
    <div class="field">
      <label id="txt_start">開始時間</label>
      <div class="t-box">
        <input type="number" class="t-num" id="f_start_h" value="8" min="0" max="22" oninput="clampH(this,22);syncTime()">
        <span class="t-sep">:</span>
        <input type="number" class="t-num" id="f_start_m" value="0" min="0" max="59" oninput="clampH(this,59);syncTime()">
        <input type="hidden" id="f_start" value="08:00">
      </div>
    </div>
    <div class="field">
      <label id="txt_end">結束時間</label>
      <div class="t-box">
        <input type="number" class="t-num" id="f_end_h" value="17" min="0" max="22" oninput="clampH(this,22);syncTime()">
        <span class="t-sep">:</span>
        <input type="number" class="t-num" id="f_end_m" value="20" min="0" max="59" oninput="clampH(this,59);syncTime()">
        <input type="hidden" id="f_end" value="17:20">
      </div>
    </div>
    <div class="field">
      <label id="txt_rest">休息(分鐘)</label>
      <input type="number" id="f_rest" value="80" min="0" placeholder="輸入分鐘數">
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label id="txt_sched">排程單號</label><input type="text" id="f_sched" placeholder="自由輸入"></div>
    <div class="field"><label id="txt_qty">數量</label><input type="number" id="f_qty" min="0" placeholder="產出數量"></div>
  </div>
  <div class="calc" id="calcBox">
    <div><div class="lbl" id="txt_hrs">實際工時</div><div class="val" id="calcH">7.33 時</div></div>
    <div><div class="lbl" id="txt_min">分鐘數</div><div class="val" id="calcM">440 分</div></div>
    <div class="warn" id="calcWarn"></div>
  </div>
</div>

<div class="card">
  <h2 id="txt_process">工序內容</h2>
  <div class="field"><label id="txt_content">工序內容</label><input type="text" id="f_content" placeholder="例：後貼地管組"></div>
  <div class="grid3">
    <div class="field"><label id="txt_weld">焊接長度 (英吋)</label><input type="number" id="f_weld_len" min="0" step="0.1" placeholder="例：16、101.6"></div>
    <div class="field"><label id="txt_std">標工 (S/支)</label><input type="number" id="f_std_s" min="0" step="0.1" placeholder="標準工時秒數"></div>
    <div class="field"><label id="txt_spec">規格 / 長度</label><input type="text" id="f_spec" placeholder="例：ψ40×80×1.8T"></div>
  </div>
  <div class="grid2">
    <div class="field"><label id="txt_note">備註</label><input type="text" id="f_note" placeholder="補充說明"></div>
  </div>
  <button class="btn btn-submit" id="btnSubmit">送出工時紀錄</button>
  <button class="btn btn-clear" id="btnClear"><span id="txt_clear">清空表單</span></button>
  <div class="status" id="statusMsg"></div>
</div>

<div class="card">
  <h2 id="txt_recent">🗑 最近紀錄（可刪除）</h2>
  <div id="recentList"><p style="font-size:13px;color:#aaa;text-align:center;padding:10px 0">載入中...</p></div>
</div>

<!-- 刪除確認 Modal -->
<div class="modal-overlay" id="delModal">
  <div class="modal-box">
    <h3 id="txt_del_title">⚠ 確認刪除</h3>
    <p id="delModalText">確定要刪除這筆紀錄嗎？此操作無法復原。</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDelModal()" id="txt_cancel">取消</button>
      <button class="btn-confirm-del" id="btnConfirmDel"><span id="txt_confirm_del">確認刪除</span></button>
    </div>
  </div>
</div>

function attachCombobox(inputId, options){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.classList.add('combo-input');
  input.setAttribute('autocomplete','off');

  const list = document.createElement('div');
  list.className = 'combo-list';
  input.insertAdjacentElement('afterend', list);

  function renderList(){
    const q = (input.value||'').trim();
    const filtered = q ? options.filter(o=>o.includes(q)) : options;
    if(!filtered.length){ list.style.display='none'; return; }
    list.innerHTML = filtered.map(o=>`<div class="combo-item">${o}</div>`).join('');
    list.style.display='block';
  }

  // 點擊/觸控欄位時就彈出清單（不需先打字）
  input.addEventListener('focus', renderList);
  input.addEventListener('click', renderList);
  input.addEventListener('input', renderList);

  // 用 mousedown（含觸控）搶在 blur 之前選取選項
  list.addEventListener('mousedown', e=>{
    const item = e.target.closest('.combo-item');
    if(!item) return;
    e.preventDefault();
    input.value = item.textContent;
    list.style.display = 'none';
    input.dispatchEvent(new Event('input'));
  });

  input.addEventListener('blur', ()=>{
    setTimeout(()=>{ list.style.display='none'; }, 150);
  });
}

// 限制數字範圍
function clampH(el, max){
  let v = parseInt(el.value)||0;
  if(v<0) v=0; if(v>max) v=max;
  el.value = v;
}
// 同步 hidden input
function syncTime(){
  const sh=String(parseInt($('f_start_h').value)||0).padStart(2,'0');
  const sm=String(parseInt($('f_start_m').value)||0).padStart(2,'0');
  const eh=String(parseInt($('f_end_h').value)||0).padStart(2,'0');
  const em=String(parseInt($('f_end_m').value)||0).padStart(2,'0');
  $('f_start').value=sh+':'+sm;
  $('f_end').value=eh+':'+em;
  updateCalc();
}
function calcMins(){
  const sh=parseInt($('f_start_h').value)||0, sm=parseInt($('f_start_m').value)||0;
  const eh=parseInt($('f_end_h').value)||0,   em=parseInt($('f_end_m').value)||0;
  const rest=parseInt($('f_rest').value||'0');
  const m=(eh*60+em)-(sh*60+sm)-rest;
  if(m<0){
    $('calcWarn').textContent=`⚠ ${t('time_err')}　${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')} → ${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
    return 0;
  }
  if(m===0){ $('calcWarn').textContent=t('time_same'); return 0; }
  $('calcWarn').textContent='';
  return m;
}
function updateCalc(){
  const m=calcMins();
  $('calcH').textContent=(m/60).toFixed(2)+' '+t('unit_h');
  $('calcM').textContent=m+' '+t('unit_m');
}
['f_start_h','f_start_m','f_end_h','f_end_m','f_rest'].forEach(id=>$(id).addEventListener('input',updateCalc));

async function loadRecent(){
  if(!SUPABASE_URL || !SUPABASE_KEY){ $('recentList').innerHTML='<p style="color:#aaa;font-size:13px">未設定雲端連線</p>'; return; }

      $('recentList').innerHTML='<p style="color:#aaa;font-size:13px;text-align:center;padding:10px 0">尚無紀錄</p>';

    $('recentList').innerHTML = data.map(rec=>{

      const label = [rec.date, rec.person, rec.cat, rec.model, rec.content, rec.schedule].filter(Boolean).join(' · ');
      const sub = `${rec.start_time||rec.start||''}–${rec.end_time||rec.end||''}  ${hrs}時` + (rec.qty?`  數量:${rec.qty}`:'') + (rec.note?`  ${rec.note}`:'');
      return `<div class="rec-item">
        <div class="rec-info">
          <strong>ID ${rec.id}</strong>　${label}<br>
          <small>${sub}</small>
        </div>
        <button class="btn-del" onclick="confirmDelete(${rec.id},'${(rec.date||'')} ${(rec.person||'')} ${(rec.cat||'')}')">刪除</button>
      </div>`;
    }).join('');
  }catch(e){
    $('recentList').innerHTML='<p style="color:#b83030;font-size:13px">載入失敗：'+e.message+'</p>';
  }
}

    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.${id}`,{

      showStatus(t('del_fail')+err,'err');

    showStatus(t('net_err2')+e.message,'err');
  }
}
